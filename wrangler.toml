name = "bayarkita"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "bayarkita"
database_id = "600e4c68-9608-4732-a628-8319cebfef3e"

# Variabel non-rahasia. Secret (ADMIN_PASSWORD, AI_API_KEY) diset via
# `wrangler pages secret put <NAMA> --project-name bayarkita`.
[vars]
ADMIN_USERNAME = "admin"
TIMEZONE = "Asia/Jakarta"
AI_BASE_URL = "https://vip-api.mind-aku.my.id/v1"
AI_MODEL = "deepseek-v4-pro"
