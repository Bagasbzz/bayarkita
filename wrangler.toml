name = "bayarkita"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# Database D1. Ganti database_id dengan ID dari dashboard Cloudflare
# (Storage & databases -> D1 -> bayarkita) atau output `wrangler d1 create bayarkita`.
[[d1_databases]]
binding = "DB"
database_name = "bayarkita"
database_id = "GANTI_DENGAN_DATABASE_ID"

# Variabel non-rahasia. Rahasia (ADMIN_PASSWORD, SESSION_SECRET) diset lewat
# dashboard Pages -> Settings -> Variables and Secrets, BUKAN di file ini.
[vars]
ADMIN_USERNAME = "admin"
TIMEZONE = "Asia/Jakarta"
